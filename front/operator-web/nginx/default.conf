server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
              text/xml application/xml application/xml+rss text/javascript
              image/svg+xml;
    gzip_min_length 256;

    # ── Docker DNS resolver ────────────────────────────────────────────
    # Allows nginx to start even when upstream containers aren't ready yet.
    # Requests to unavailable backends will return 502 until they come up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── CORS (kept for cross-origin access during development) ─────────
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

    # ── Frontend static files (SPA) ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashed assets — long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API reverse proxy ─────────────────────────────────────────────

    # Auth service
    location /api/v1/auth {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            return 204;
        }
        proxy_pass http://auth:8000;
    }

    # Routing service (variable-based proxy_pass + Docker DNS so nginx
    # can start even when this upstream isn't running yet)
    location /api/v1/routing {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            return 204;
        }
        set $routing_upstream "routing";
        proxy_pass http://$routing_upstream:8000;
    }

    # Location tracker — WebSocket-capable
    location /api/v1/locationTracker {
        proxy_pass http://paramedic-location-updater:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Coordination — WebSocket-capable
    location /api/v1/coordination {
        proxy_pass http://coordinator:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Historical API
    location /api/v1/historic {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            return 204;
        }
        proxy_pass http://historical-api:8000;
    }

    # Paramedic recommendation
    location /api/v1/paramedicRecommendation {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            return 204;
        }
        proxy_pass http://paramedic-recommendation:8000;
    }

    # Medical center recommendation
    location /api/v1/medicalCenterRecommendation {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            return 204;
        }
        proxy_pass http://medical-center-recommendation:8000;
    }
}