[project]
name = "paramedic-recommendation"
version = "0.1.0"
description = "A REST API to recommend nearby paramedics to assign to a given emergency"
authors = [
    {name = "Fernando González Rivero",email = "fernando.gonzalezr@upb.edu.co"}
]
readme = "README.md"
requires-python = "<4,>=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
core = {path = "../core"}
docker-discovery = {path = "../docker-service-discovery"}
fastapi = {extras = ["standard"], version = "^0.136"}
sie-auth = {path = "../auth"}
