[project]
name = "docker_discovery"
version = "0.1.6"
description = "This package provides a dummy implementation for the ServiceDiscoveryPort based on reading a docker-compose.yml file."
authors = [
    {name = "Fernando González Rivero",email = "fernando.gonzalezr@upb.edu.co"}
]
readme = "README.md"
requires-python = "<4,>=3.12"
dynamic = ["dependencies"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
core = {path = "../core"}
dragonfly-rtstorage = {path = "../dragonfly-realtime-storage"}
pyyaml = "^6.0.3"
pytest-aio = "^2.1.7"
pyserde = "^0.31.0"
aio-pika = "^9.6.1"
mongo-historical-register = {path = "../mongo-historical-register"}
