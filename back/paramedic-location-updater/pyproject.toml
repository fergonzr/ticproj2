[project]
name = "paramedic-location-updater"
version = "0.1.0"
description = "A Websocket API to keep the paramedic location updated all the time."
authors = [
    {name = "Fernando González Rivero",email = "fernando.gonzalezr@upb.edu.co"}
]
readme = "README.md"
requires-python = "<4,>=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
core = {path = "../core"}
docker-discovery = {path = "../docker-service-discovery"}
fastapi = {extras = ["standard"], version = "^0.135.1"}
sie-auth = {path = "../auth"}
