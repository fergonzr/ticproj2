[project]
name = "sie_auth"
version = "0.1.3"
description = "A package that provides an REST API to get authentication tokens for use in other services and a library to verify such tokens"
authors = [
    {name = "Fernando González Rivero",email = "fernando.gonzalezr@upb.edu.co"}
]
readme = "README.md"
requires-python = "<4,>=3.12"
dynamic = ["dependencies"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
core = {path = "../core"}
docker-discovery = {path = "../docker-service-discovery"}
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
fastapi = {extras = ["standard"], version = "^0.136"}
pyjwt = {extras = ["crypto"], version = "^2.12.1"}
