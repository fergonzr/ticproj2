[project]
name = "routing"
version = "0.1.0"
description = "Proxy service for GraphHopper Routing API"
authors = [
    {name = "Isabela",email = "holguinkintero@gmail.com"}
]
readme = "README.md"
requires-python = "<4,>=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
core = {path = "../core"}
fastapi = {extras = ["standard"], version = "^0.136"}
httpx = "^0.28.0"
shapely = "^2.0.6" 
docker-discovery = {path = "../docker-service-discovery"}
sie-auth = {path = "../auth"}