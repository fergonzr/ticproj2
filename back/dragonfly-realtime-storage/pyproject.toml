[project]
name = "dragonfly-rtstorage"
version = "0.1.10"
description = "This packgage provides an adapter for the dragonflyDB in-memory database"
authors = [
    {name = "Fernando González Rivero",email = "fernando.gonzalezr@upb.edu.co"}
]
readme = "README.md"
requires-python = "<4,>=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
core = {path = "../core"}
port-integration-tests = {path = "../port-integration-tests"}
pytest-asyncio = "^1.3.0"
pyserde = "^0.31.0"
redis = "^7.3.0"
